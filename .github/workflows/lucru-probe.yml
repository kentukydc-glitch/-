name: Inspect public Lucru endpoints
on:
  push:
    branches: [automation/lucru-access]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/probe_dates.py
      - name: Save public endpoint evidence
        env:
          GH_REPORT_TOKEN: ${{ github.token }}
        run: |
          cd output
          printf '%s\n' "$GITHUB_RUN_ID" > run-id.txt
          git init -b lucru-access-report
          git add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m 'Public Lucru endpoint evidence'
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_REPORT_TOKEN" | base64 -w0)" push --force origin HEAD:refs/heads/lucru-access-report
